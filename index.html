<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al Sistema</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }
        h2 { color: #333; margin-bottom: 20px; }
        .error-msg { color: #dc3545; margin-top: 15px; font-size: 14px; display: none; }
        #loading { display: none; margin-top: 15px; color: #007bff; font-weight: bold; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Sistema de Registro</h2>
        <p>Inicia sesión con un correo autorizado para continuar.</p>
        
        <div style="display: flex; justify-content: center; margin-top: 20px;">
            <div id="g_id_onload"
                 data-client_id="692773787584-csvs916sel3hba7k0m12nu9ilaqu7evf.apps.googleusercontent.com"
                 data-callback="handleCredentialResponse"
                 data-auto_select="true">
            </div>
            <div class="g_id_signin" data-type="standard" data-theme="filled_blue"></div>
        </div>

        <div id="loading">Verificando credenciales...</div>
        <div id="errorMsg" class="error-msg">Acceso denegado. Este correo no está registrado en el sistema.</div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwElcCVPpbU91m3tEG4k6UYVqNYUzl-Lu8OR5-TL9nyx5T37lF4n_LldubUsFmf1uXKEw/exec";

        // Si ya hay sesión activa, redirigir directo
        if(sessionStorage.getItem("userEmail")) {
            window.location.href = "sistema.html";
        }

        function handleCredentialResponse(response) {
            document.getElementById("errorMsg").style.display = "none";
            document.getElementById("loading").style.display = "block";

            // Decodificar token de Google
            const base64Url = response.credential.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = JSON.parse(window.atob(base64));
            const email = jsonPayload.email;

            // Verificar con el servidor si el correo tiene permiso
            fetch(`${API_URL}?action=verificar&email=${encodeURIComponent(email)}`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById("loading").style.display = "none";
                    if(data.autorizado) {
                        sessionStorage.setItem("userEmail", email);
                        window.location.href = "sistema.html"; // Enviar al sistema
                    } else {
                        document.getElementById("errorMsg").style.display = "block";
                        google.accounts.id.revoke(email, done => {}); // Cerrar sesión de Google
                    }
                })
                .catch(error => {
                    document.getElementById("loading").style.display = "none";
                    alert("Error de conexión con el servidor.");
                });
        }
    </script>
</body>
</html>
