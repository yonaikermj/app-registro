<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro Seguro</title>
    <!-- Librería de Google Sign-In -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: auto; }
        #appSection { display: none; }
        #tablaDatos { display: none; }
        #cuerpoTabla { display: none; }
        input, button { padding: 10px; margin: 5px 0; width: 100%; }
    </style>
</head>
<body>

    <!-- Botón de Google -->
    <div id="loginSection">
        <h2>Inicia sesión para acceder</h2>
        <div id="g_id_onload"
             data-client_id="692773787584-csvs916sel3hba7k0m12nu9ilaqu7evf.apps.googleusercontent.com"
             data-callback="handleCredentialResponse">
        </div>
        <div class="g_id_signin" data-type="standard"></div>
    </div>

    <!-- Sección privada -->
    <div id="appSection">
        <h2>Registrar Persona</h2>
        <form id="registroForm">
            <input type="text" id="nombre" placeholder="Nombre" required>
            <input type="text" id="apellido" placeholder="Apellido" required>
            <input type="text" id="cedula" placeholder="Cédula" required>
            <button type="submit">Enviar</button>
        </form>
    </div>

    <!-- Tabla donde se mostrarán los datos -->
    <table id="tablaDatos">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Cédula</th>
            </tr>
        </thead>
        <tbody id="cuerpoTabla">
            <!-- Los datos de Google Sheets aparecerán aquí -->
        </tbody>
    </table>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwElcCVPpbU91m3tEG4k6UYVqNYUzl-Lu8OR5-TL9nyx5T37lF4n_LldubUsFmf1uXKEw/exec";
        let userEmail = "";

        // Función que se activa al loguearse
        function handleCredentialResponse(response) {
            // Decodificamos el token (JWT) para sacar el correo
            const base64Url = response.credential.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = JSON.parse(window.atob(base64));
            
            userEmail = jsonPayload.email;
            
            // Ocultamos login, mostramos app
            document.getElementById("loginSection").style.display = "none";
            document.getElementById("appSection").style.display = "block";
            document.getElementById("tablaDatos").style.display = "block";
            document.getElementById("cuerpoTabla").style.display = "block";
            alert("Bienvenido, " + userEmail);
        }

        // 1. FUNCIÓN PARA LEER Y MOSTRAR LOS DATOS
        function cargarDatos() {
    // 1. Hacemos la petición al servidor (Apps Script)
    fetch(API_URL)
        .then(response => response.json()) // Convertimos la respuesta a formato JSON
        .then(datos => {
            const cuerpoTabla = document.getElementById("cuerpoTabla");
            cuerpoTabla.innerHTML = ""; // Limpiamos la tabla antes de cargar para evitar duplicados

            // 2. Recorremos los datos (datos[0] es la cabecera, así que saltamos la fila 0)
            datos.forEach((fila, index) => {
                if (index === 0) return; 

                // 3. Creamos una nueva fila en la tabla
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${fila[0]}</td>
                    <td>${fila[1]}</td>
                    <td>${fila[2]}</td>
                `;
                cuerpoTabla.appendChild(tr);
            });
        })
        .catch(error => console.error('Error al cargar datos:', error));
}
        // 2. FUNCIÓN PARA GUARDAR NUEVOS DATOS
        document.getElementById("registroForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const payload = {
                nombre: document.getElementById("nombre").value,
                apellido: document.getElementById("apellido").value,
                cedula: document.getElementById("cedula").value,
                email: userEmail
            };

            fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            })
            .then(r => r.json())
            .then(res => {
                if(res.estado === "exito") alert("Guardado con éxito");
                else alert("Error: " + res.mensaje);
            });
        });
        
    </script>
</body>
</html>
