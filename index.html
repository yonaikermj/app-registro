<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prototipo de Registro</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: auto; }
        form { background: #f4f4f4; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        input { display: block; width: 95%; margin-bottom: 10px; padding: 8px; }
        button { background: #28a745; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 5px; }
        button:hover { background: #218838; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #007bff; color: white; }
    </style>
</head>
<body>

    <h2>Registro de Personas</h2>

    <!-- Formulario para agregar datos -->
    <form id="formulario">
        <input type="text" id="nombre" placeholder="Ingresa el Nombre" required>
        <input type="text" id="apellido" placeholder="Ingresa el Apellido" required>
        <input type="text" id="cedula" placeholder="Ingresa la Cédula" required>
        <button type="submit">Guardar Datos</button>
    </form>

    <!-- Tabla donde se mostrarán los datos -->
    <table id="tablaDatos">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Cédula</th>
            </tr>
        </thead>
        <tbody id="cuerpoTabla">
            <!-- Los datos de Google Sheets aparecerán aquí -->
        </tbody>
    </table>

    <script>
        // PEGA AQUÍ LA URL QUE COPIASTE DE GOOGLE APPS SCRIPT
        const API_URL = "https://script.google.com/macros/s/AKfycbwElcCVPpbU91m3tEG4k6UYVqNYUzl-Lu8OR5-TL9nyx5T37lF4n_LldubUsFmf1uXKEw/exec";

        // 1. FUNCIÓN PARA LEER Y MOSTRAR LOS DATOS
        function cargarDatos() {
            fetch(API_URL)
                .then(respuesta => respuesta.json())
                .then(datos => {
                    const tbody = document.getElementById("cuerpoTabla");
                    tbody.innerHTML = ""; // Limpiamos la tabla antes de cargar

                    // Omitimos la primera fila (index 0) porque son los encabezados (Nombre, Apellido, Cédula)
                    for (let i = 1; i < datos.length; i++) {
                        let fila = datos[i];
                        tbody.innerHTML += `
                            <tr>
                                <td>${fila[0]}</td>
                                <td>${fila[1]}</td>
                                <td>${fila[2]}</td>
                            </tr>
                        `;
                    }
                })
                .catch(error => console.error("Error al cargar:", error));
        }

        // 2. FUNCIÓN PARA GUARDAR NUEVOS DATOS
        document.getElementById("formulario").addEventListener("submit", function(event) {
            event.preventDefault(); // Evita que la página se recargue

            // Recolectamos los datos escritos
            const nuevosDatos = {
                nombre: document.getElementById("nombre").value,
                apellido: document.getElementById("apellido").value,
                cedula: document.getElementById("cedula").value
            };

            // Enviamos los datos a Google Sheets
            fetch(API_URL, {
                method: "POST",
                body: JSON.stringify(nuevosDatos),
                // Usamos text/plain para evitar errores de bloqueo (CORS) en el navegador
                headers: { "Content-Type": "text/plain" }
            })
            .then(() => {
                alert("¡Datos guardados con éxito!");
                document.getElementById("formulario").reset(); // Limpia los campos
                cargarDatos(); // Vuelve a cargar la tabla para mostrar el nuevo registro
            })
            .catch(error => console.error("Error al guardar:", error));
        });

        // Al abrir la página, cargamos los datos inmediatamente
        cargarDatos();
    </script>
</body>
</html>
